[workspace]
resolver = "2"
members = [
    "reputation_token",
    "proposal_contract",
    "treasury_contract",
]

# Release profile settings optimized for minimal Soroban WebAssembly contract size output
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[patch.crates-io]
ethnum = { path = "../ethnum-patch" }

