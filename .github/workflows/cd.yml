name: GrantPulse CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-smart-contracts:
    name: Deploy Smart Contracts (Soroban Testnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contract/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM Smart Contracts
        run: |
          cd contract
          cargo build --workspace --target wasm32-unknown-unknown --release --locked

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt || true

      - name: Deploy to Stellar Testnet (If Secret Provided)
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          STELLAR_NETWORK: testnet
        run: |
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "Deploying contracts to Stellar Testnet..."
            # Example deployment step using stellar CLI
            # stellar contract deploy --wasm contract/target/wasm32-unknown-unknown/release/grantpulse.wasm --source-account "$STELLAR_SECRET_KEY" --network "$STELLAR_NETWORK"
          else
            echo "STELLAR_SECRET_KEY repository secret not configured. Skipping contract network deployment."
          fi

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-smart-contracts
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Deploy to Hosting / GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
